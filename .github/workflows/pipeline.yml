name: "Terraform"
on:
  push:
    branches:
      - main
  pull_request:

env:
  tf_version: 1.3.9
  tflint_version: v0.45.0

concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.pull_request.head.ref || github.ref }}

jobs:
  linters:
    name: "Terraform Linters"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.tf_version }}
          terraform_wrapper: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.tflint_version }}
      - name: Setup TFLint cache plugin dir
        uses: actions/cache@v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - name: Test code with terraform fmt
        run: terraform fmt --recursive -check=true --diff
        continue-on-error: true
      - name: Test code with TFLint
        continue-on-error: true
        run: |
          tflint --init
          tflint -f compact
      - name: Test code with TFSec
        continue-on-error: true
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
      - name: Test code with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: /
          framework: terraform
          soft_fail: true
          quiet: true
          download_external_modules: false
  release-gate:
    name: "Release gate"
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.gate.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the push deserves a release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.username }}
        run: |
          set -euo pipefail

          release=true

          if [ "${EVENT_NAME}" != "push" ]; then
            echo "release=${release}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A push that only touches examples/ does not change the module
          # behaviour, so it does not need a tag or a GitHub release.
          if [ -z "${BEFORE_SHA}" ] || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          else
            base="${BEFORE_SHA}"
          fi
          changed="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          if [ -z "${changed}" ]; then
            echo "The push contains no file changes - release skipped"
            release=false
          else
            non_examples="$(printf '%s\n' "${changed}" | grep -vc '^examples/' || true)"
            if [ "${non_examples}" -eq 0 ]; then
              echo "Only files under examples/ changed - release skipped"
              release=false
            fi
          fi

          # Dependabot bumps are noise for consumers unless the dependency's
          # major version changes. A squash-merged Dependabot commit carries
          # "update-type: version-update:semver-<level>" in its body; fall back
          # to the "from <old> to <new>" title for commits without the body.
          if [[ "${COMMIT_AUTHOR}" == "dependabot[bot]" || "${COMMIT_MESSAGE,,}" =~ ^build\(deps ]]; then
            if grep -q 'update-type: version-update:semver-major' <<< "${COMMIT_MESSAGE}"; then
              echo "Dependabot major update - release allowed"
            elif grep -q 'update-type: version-update:semver-' <<< "${COMMIT_MESSAGE}"; then
              echo "Dependabot non-major update - release skipped"
              release=false
            elif [[ "${COMMIT_MESSAGE}" =~ from[[:space:]]+v?([0-9]+)(\.[0-9]+)*[[:space:]]+to[[:space:]]+v?([0-9]+) ]]; then
              from_major="${BASH_REMATCH[1]}"
              to_major="${BASH_REMATCH[3]}"
              if [ "${to_major}" -le "${from_major}" ]; then
                echo "Dependabot update ${from_major}.x -> ${to_major}.x is not major - release skipped"
                release=false
              fi
            else
              echo "Cannot determine the Dependabot update type - release skipped"
              release=false
            fi
          fi

          echo "release=${release}" >> "$GITHUB_OUTPUT"
  semver:
    name: "Set code version tag"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - linters
      - release-gate
    if: needs.release-gate.outputs.release == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Check out code
        uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Set application version
        id: set_version
        uses: kvendingoldo/git-flow-action@v2.16.0
        with:
          enable_github_release: true
          auto_release_branches: main
          tag_prefix_release: "v"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
